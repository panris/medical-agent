server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:medical_agent;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000

  application:
    name: medical-agent

# LLM 配置（可通过 POST /api/v1/config/llm 动态覆盖，存到 llm.config-file）
llm:
  config-file: ${LLM_CONFIG_FILE:config/llm-config.json}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  default-model: ${DEFAULT_MODEL_NAME:gpt-4o-mini}
  temperature: ${DEFAULT_TEMPERATURE:0.2}
  max-tokens: ${DEFAULT_MAX_TOKENS:2048}

embedding:
  provider: ${EMBEDDING_PROVIDER:openai}
  model: ${EMBEDDING_MODEL:text-embedding-3-small}
  dimension: ${EMBEDDING_DIMENSION:1536}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

retrieval:
  top-k: 3
  confidence-threshold: 0.4
  vector-weight: 0.7
  text-weight: 0.3

session:
  ttl-minutes: 30

cors:
  allowed-origins: "*"

---
# PostgreSQL + pgvector profile
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/medical_agent
    username: medical
    password: medical_dev_password
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    com.medicalagent: DEBUG
    root: INFO
