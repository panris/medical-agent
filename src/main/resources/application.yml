server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medical_agent}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000

  application:
    name: medical-agent

llm:
  provider: ${DEFAULT_MODEL_PROVIDER:openai}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  default-model: ${DEFAULT_MODEL_NAME:gpt-4o-mini}
  temperature: ${DEFAULT_TEMPERATURE:0.2}
  max-tokens: ${DEFAULT_MAX_TOKENS:2048}

embedding:
  provider: ${EMBEDDING_PROVIDER:openai}
  model: ${EMBEDDING_MODEL:text-embedding-3-small}
  dimension: ${EMBEDDING_DIMENSION:1536}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

retrieval:
  top-k: 3
  confidence-threshold: 0.4
  vector-weight: 0.7
  text-weight: 0.3

session:
  ttl-minutes: 30

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    com.medicalagent: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
